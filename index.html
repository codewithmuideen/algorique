    <!-- ?v= forces browsers to drop cached icons; bump it whenever the icons change -->

    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />

    <style>
      /* Splash screen: shown instantly, removed by src/main.jsx once the page is ready */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: #f8fafd;
        transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.6s;
      }
      #splash.is-done {
        opacity: 0;
        visibility: hidden;
      }
      #splash .splash-inner {
        display: grid;
        justify-items: center;
        gap: 22px;
      }
      #splash .splash-mark {
        width: 88px;
        height: auto;
        animation: splash-breathe 1.6s ease-in-out infinite;
      }
      #splash .splash-bar {
        position: relative;
        width: 120px;
        height: 3px;
        overflow: hidden;
        border-radius: 3px;
        background: #e1e9f5;
      }
      #splash .splash-bar::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: 3px;
        background: linear-gradient(90deg, #0b4fb3, #6cc24a);
        animation: splash-slide 1.1s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes splash-breathe {
        50% { transform: scale(1.06); }
      }
      @keyframes splash-slide {
        from { transform: translateX(-100%); }
        to { transform: translateX(250%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .splash-mark, #splash .splash-bar::after { animation: none; }
      }
      /* Crawler-readable fallback content: in the HTML, never painted */
      .seo-fallback {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
    </style>
  </head>
