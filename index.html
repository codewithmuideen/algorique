<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1F44" />
    <meta name="format-detection" content="telephone=no" />
    <!-- seo:head (title, description, canonical, social tags and JSON-LD are injected per route; see vite.config.js) -->

    <!-- ?v= forces browsers to drop cached icons; bump it whenever the icons change -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/site.webmanifest?v=2" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
  </head>
  <body>
    <div id="root"><!-- seo:body --></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
